<!doctype html>
<meta charset="utf-8">
<title>Downloads</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body { margin: 0; display: grid; place-items: center; min-height: 100vh; background: #f0f1f2; color: #333;
       font: 14px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif; }
div { background: #fff; border: 1px solid #dcdee0; border-radius: 4px; padding: 26px 30px; max-width: 460px; }
h1 { font-size: 17px; font-weight: 500; margin: 0 0 10px; }
p { margin: 0 0 8px; color: #666; }
code { font-family: Consolas, Menlo, monospace; font-size: 12.5px; background: #f3f4f5; padding: 1px 5px; border-radius: 3px; }
</style>
<div>
  <h1>Open this from DSM</h1>
  <p>This window belongs to the Abstraction Downloads package. Its icon in DSM carries the key that opens it, so sign in to DSM and click that instead of typing this address.</p>
  <p>The key is also in <code>/var/packages/AbstractionJobd/etc/ui.key</code> on the NAS, and goes on the end as <code>?k=</code>.</p>
</div>
